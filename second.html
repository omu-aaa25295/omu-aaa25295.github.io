<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お薦めな旅行先</title>
    <style>
        h1 {
            text-align: center;
        }
        .jump {
            text-align: center;
        }
    </style>
</head>
<body>
    <h2>BMI指標計算</h2>
    <form oninput="bmi.value = Math.round(Number(weight.value) / Math.pow(Number(height.value)/100, 2) * 10) / 10">
    <p><label>体重(kg)：<input name="weight" type="number" step="any"></label></p>
    <p><label>身長(cm)：<input name="height" type="number" step="any"></label></p>
    <p><label>BMI：<output name="bmi"></output></label></p>
    </form>
    <hr>
    <h1>お薦めな旅行先</h1>
    <hr>
    <div>
        <h2>【関西圏TOP5】</h2>
        <ul>
            <li><b>天橋立(京都)</b></li>
            <li>八坂神社(京都)</li>
            <li>平等院 鳳凰堂(京都)</li>
            <li>興福寺(奈良)</li>
            <li>造幣局(桜の通り抜け)(大阪)</li>
        </ul>
    </div>
    <br>
    <hr>
    <div class="jump">
        <a href="index.html">1ページ目へ</a>
    </div>
</body>
</html>
